<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sonni Top O'yini{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --accent-glow: rgba(6, 182, 212, 0.3);
      --danger: #f43f5e;
      --warning: #f59e0b;
      --success: #10b981;
      --surface: rgba(15, 23, 42, 0.65);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(139, 92, 246, 0.08) 0px, transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.25rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      position: relative;
    }
    h1, h2 {
      margin-bottom: 0.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 1.75rem;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      margin-bottom: 0.45rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    input[type="text"],
    input[type="password"],
    input[type="number"] {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem 1.25rem;
      background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 8px 20px -6px var(--primary-glow);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    button:hover, .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -6px var(--primary-glow);
    }
    button:active, .btn:active {
      transform: translateY(0);
    }
    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--card-border);
      color: var(--text);
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .btn-logout {
      width: auto;
      padding: 0.45rem 0.9rem;
      font-size: 0.82rem;
      background: var(--surface);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 10px;
      box-shadow: none;
    }
    .btn-logout:hover {
      color: var(--danger);
      border-color: rgba(244, 63, 94, 0.3);
      background: rgba(244, 63, 94, 0.1);
      transform: none;
    }
    .footer-links {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .footer-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }
    .footer-links a:hover {
      text-decoration: underline;
      color: #38bdf8;
    }
    .error-list {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      padding: 0.85rem 1.1rem;
      border-radius: 12px;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
      list-style-position: inside;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
